alerts:
  - name: high_p95_latency
    severity: critical
    condition: p95(latency_ms) > 3000ms
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-1-high-p95-latency
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2.0%
    duration: 3m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-2-high-error-rate
  - name: cost_budget_breach
    severity: warning
    condition: total_cost_usd > 2.50 USD
    duration: 10m
    type: symptom-based
    channel: slack
    owner: finops-lead
    runbook: docs/alerts.md#alert-3-cost-budget-breach
